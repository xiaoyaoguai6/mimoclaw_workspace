<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿尔法工坊 · 火山凤鸣</title>
  <meta name="description" content="火山凤鸣科技 · 阿尔法工坊 — A 股 AI 模拟炒股，多智能体协作决策">
  <link rel="icon" type="image/png" href="/logo.png">
  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== Full-page background ===== */
    .page-bg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a2844;
      position: relative;
      overflow: hidden;
    }

    /* Grid overlay */
    .grid-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.10;
      background-image:
        linear-gradient(rgba(245, 166, 35, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 166, 35, 0.15) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* Gradient orbs */
    .orb-golden {
      position: absolute;
      top: 25%;
      left: 25%;
      width: 24rem;
      height: 24rem;
      border-radius: 50%;
      opacity: 0.10;
      background: radial-gradient(circle, rgb(245, 166, 35) 0%, transparent 70%);
      pointer-events: none;
    }

    .orb-blue {
      position: absolute;
      bottom: 25%;
      right: 25%;
      width: 16rem;
      height: 16rem;
      border-radius: 50%;
      opacity: 0.08;
      background: radial-gradient(circle, rgb(30, 64, 175) 0%, transparent 70%);
      pointer-events: none;
    }

    /* SVG stock chart lines */
    .chart-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.05;
      pointer-events: none;
    }

    /* ===== Glass card ===== */
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 28rem;
      margin: 0 1rem;
      border-radius: 1rem;
      padding: 2.5rem;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(245, 166, 35, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 60px rgba(245, 166, 35, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    /* ===== Header section ===== */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .logo-container {
      width: 4rem;
      height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .logo-icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #F5A623;
      filter: drop-shadow(0 0 12px rgba(245, 166, 35, 0.4));
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 0.875rem;
      margin-top: 0.5rem;
      color: rgba(245, 166, 35, 0.8);
    }

    .status-bar {
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 0.375rem;
      height: 0.375rem;
      border-radius: 50%;
      background: rgb(34, 197, 94);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .status-text {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
    }

    /* ===== Form ===== */
    .form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .field-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 1rem;
      display: flex;
      align-items: center;
      pointer-events: none;
      width: 1.25rem;
      height: 100%;
    }

    .input-icon i {
      font-size: 1rem;
      color: rgba(245, 166, 35, 0.6);
    }

    .field-input {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 2.75rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      color: #fff;
      outline: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .field-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .field-input:focus {
      border-color: rgba(245, 166, 35, 0.5);
      box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.1);
    }

    .eye-btn {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 1rem;
      display: flex;
      align-items: center;
      width: 1.25rem;
      height: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .eye-btn i {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.3);
      transition: color 0.2s;
    }

    .eye-btn:hover i {
      color: rgba(255, 255, 255, 0.6);
    }

    /* ===== Links row ===== */
    .links-row {
      display: flex;
      justify-content: space-between;
    }

    .links-row a {
      font-size: 0.75rem;
      color: rgba(245, 166, 35, 0.7);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .links-row a:hover {
      color: rgba(245, 166, 35, 1);
      text-decoration: underline;
    }

    /* ===== Submit button ===== */
    .submit-btn {
      width: 100%;
      padding: 1rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgb(245, 166, 35) 0%, rgb(232, 148, 26) 100%);
      color: rgb(10, 22, 40);
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(245, 166, 35, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn .btn-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .submit-btn i {
      font-size: 1rem;
    }

    /* Shimmer effect on button */
    .submit-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255, 255, 255, 0.15) 50%,
        transparent 100%
      );
      transform: rotate(30deg);
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) rotate(30deg); }
      100% { transform: translateX(100%) rotate(30deg); }
    }

    /* ===== Footer ===== */
    .footer {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .footer-note {
      font-size: 0.75rem;
      text-align: center;
      color: rgba(255, 255, 255, 0.25);
    }

    .badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .badge i {
      color: rgba(245, 166, 35, 0.5);
      font-size: 0.875rem;
    }

    /* ===== Floating particles ===== */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(245, 166, 35, 0.3);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
    }

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .login-card {
        padding: 1.5rem;
        margin: 0 0.5rem;
      }
      .badges {
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-bg">
    <!-- Background effects -->
    <div class="grid-overlay"></div>
    <div class="orb-golden"></div>
    <div class="orb-blue"></div>

    <!-- SVG stock chart lines -->
    <svg class="chart-lines" preserveAspectRatio="none" viewBox="0 0 1440 800">
      <polyline points="0,600 200,450 400,500 600,380 800,420 1000,320 1200,360 1440,280"
                fill="none" stroke="#F5A623" stroke-width="2"/>
      <polyline points="0,650 200,520 400,560 600,440 800,480 1000,380 1200,410 1440,340"
                fill="none" stroke="#F5A623" stroke-width="1"/>
    </svg>

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <!-- Login card -->
    <div class="login-card">
      <!-- Header -->
      <div class="header">
        <div class="logo-container">
          <div class="logo-icon">
            <i class="ri-robot-2-fill"></i>
          </div>
        </div>
        <h1 class="title">AI交易员</h1>
        <p class="subtitle">由 AI 驱动的模拟炒股体验</p>
        <div class="status-bar">
          <span class="status-dot"></span>
          <span class="status-text">系统运行正常 · A股实时行情接入中</span>
        </div>
      </div>

      <!-- Form -->
      <form class="form" onsubmit="handleSubmit(event)">
        <div class="field-group">
          <label>专属账号</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <i class="ri-user-line"></i>
            </div>
            <input type="text" class="field-input" placeholder="请输入主站下发的账号" autocomplete="username">
          </div>
        </div>

        <div class="field-group">
          <label>密码</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <i class="ri-lock-line"></i>
            </div>
            <input type="password" class="field-input" id="password" placeholder="请输入密码" autocomplete="current-password">
            <button type="button" class="eye-btn" onclick="togglePassword()">
              <i class="ri-eye-line" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div class="links-row">
          <a href="#">还没有账号？注册</a>
          <a href="#">忘记密码？</a>
        </div>

        <button type="submit" class="submit-btn">
          <span class="btn-content">
            <i class="ri-robot-line"></i>
            进入交易台
          </span>
        </button>
      </form>

      <!-- Footer -->
      <div class="footer">
        <p class="footer-note">账号由主站授权下发 · 仅供模拟交易使用 · 不涉及真实资金</p>
        <div class="badges">
          <span class="badge">
            <i class="ri-shield-check-line"></i>
            数据加密传输
          </span>
          <span class="badge">
            <i class="ri-time-line"></i>
            实时行情驱动
          </span>
          <span class="badge">
            <i class="ri-robot-2-line"></i>
            AI全自主决策
          </span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ri-eye-off-line';
      } else {
        input.type = 'password';
        icon.className = 'ri-eye-line';
      }
    }

    // Form submit handler
    function handleSubmit(e) {
      e.preventDefault();
      const phone = document.getElementById('phone')?.value?.trim();
      const password = document.getElementById('password')?.value?.trim();
      const btn = document.querySelector('.submit-btn');

      if (!phone || !password) {
        showToast('请输入手机号和密码');
        return;
      }

      // 验证 (模拟)
      btn.innerHTML = '<span class="btn-content"><i class="ri-loader-4-line" style="animation:spin 1s linear"></i> 登录中...</span>';
      btn.disabled = true;

      setTimeout(() => {
        if (phone === '18138018452' && password === 'qwertyuiop1') {
          localStorage.setItem('ai_trader_logged_in', 'true');
          localStorage.setItem('ai_trader_user', JSON.stringify({ phone, name: phone.slice(0, 3) + '****' + phone.slice(-4) }));
          showToast('登录成功');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
        } else {
          showToast('手机号或密码错误');
          btn.innerHTML = '<span class="btn-content">登 录</span>';
          btn.disabled = false;
        }
      }, 800);
    }

    // 检查登录状态
    if (localStorage.getItem('ai_trader_logged_in') === 'true') {
      // 已登录，跳转
      // window.location.href = 'dashboard.html'; // 取消注释则自动跳转
    }

    // Generate floating particles
    function createParticles() {
      const container = document.getElementById('particles');
      const count = 20;
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
        particle.style.animationDelay = (Math.random() * 10) + 's';
        particle.style.width = (Math.random() * 2 + 1) + 'px';
        particle.style.height = particle.style.width;
        container.appendChild(particle);
      }
    }

    createParticles();

    // Toast
    function showToast(msg, duration = 2500) {
      let toast = document.querySelector('.toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.cssText = 'position:fixed;top:5rem;right:1.5rem;z-index:100;padding:0.75rem 1.25rem;border-radius:0.75rem;background:#0f172a;color:#fff;font-size:0.8125rem;box-shadow:0 4px 20px rgba(0,0,0,0.15);transform:translateX(120%);transition:transform 0.3s;';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.transform = 'translateX(0)';
      setTimeout(() => { toast.style.transform = 'translateX(120%)'; }, duration);
    }
  </script>
</body>
</html>
